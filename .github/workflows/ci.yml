name: build-and-publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. Сборка образа ---
      - name: Build Docker image
        run: docker build -t mlops-hw1:test .

      # --- 2. Smoke-тест: сервис из образа реально отвечает ---
      - name: Smoke test in container
        run: |
          # Поднимаем контейнер 
          docker run -d --name svc -p 8000:8000 mlops-hw1:test

          # Ждём readiness 
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/v2/health/ready; then break; fi
            sleep 2
          done

          # Контрольный запрос: метаданные + infer
          curl -sf http://127.0.0.1:8000/v2/models/mobilenetv2
          python3 - <<'EOF'
          import json, urllib.request
          payload = {"inputs": [{"name": "input", "shape": [1, 3, 224, 224],
                                 "datatype": "FP32", "data": [0.5] * (1*3*224*224)}]}
          req = urllib.request.Request(
              "http://127.0.0.1:8000/v2/models/mobilenetv2/infer",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"})
          resp = json.load(urllib.request.urlopen(req))
          assert resp["outputs"], "пустой ответ infer"
          print("Smoke infer OK:", resp["outputs"][0]["shape"])
          EOF
          docker logs svc
          docker stop svc

      # --- 3. Публикация в GitHub
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          docker tag mlops-hw1:test $IMAGE:latest
          docker tag mlops-hw1:test $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          echo "Опубликовано: $IMAGE:latest"
